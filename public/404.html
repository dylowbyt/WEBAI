<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>404 - XYA AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7ff;
      color: #1a1a1a;
    }

    .container {
      text-align: center;
      max-width: 500px;
      padding: 20px;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(106, 92, 255, 0.1);
      color: #6a5cff;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 100px;
      font-weight: 800;
      background: linear-gradient(90deg, #6a5cff, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    p {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: linear-gradient(90deg, #6a5cff, #00c6ff);
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      box-shadow: 0 5px 20px rgba(106, 92, 255, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(106, 92, 255, 0.4);
    }

    .logo {
      font-weight: 700;
      margin-bottom: 10px;
      color: #6a5cff;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 70px;
      }

      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">XYA AI</div>

    <div class="badge">⚡ Halaman Tidak Ditemukan</div>

    <h1>404</h1>

    <h2>Ups, halaman hilang 😅</h2>

    <p>Sepertinya halaman yang kamu cari tidak tersedia atau sudah dipindahkan.</p>

    <a href="/" class="btn">Kembali ke Beranda</a>
  </div>

</body>
</html>
